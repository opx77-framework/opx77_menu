<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPX77 Menu</title>
<!-- open77-ui.css is mirrored byte-for-byte across resources: edit menu.css instead. -->
<link rel="stylesheet" href="open77-ui.css">
<link rel="stylesheet" href="menu.css">
</head>
<body>

<!-- No focusable element: a "hud" surface is never focused. -->
<div class="strip" id="strip">

  <header class="head">
    <span class="title" id="title">MENU</span>
  </header>

  <!-- The breadcrumb, inside a submenu only. -->
  <p class="trail" id="trail"></p>

  <!-- The rows, with a scroll rail down the leading edge. -->
  <ul class="list" id="list"></ul>

  <!-- The selected row's description, when it has one. -->
  <p class="hint" id="hint"></p>

  <!-- The caller's transient status line. -->
  <p class="status" id="status"></p>

</div>

<script src="menu.js"></script>
</body>
</html>
